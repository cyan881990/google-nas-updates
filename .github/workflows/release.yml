name: Build and release Windows application
on:
  push:
    branches: ['main']
    tags: ['v*']
    paths: ['src/Core.cs']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cyan-nas-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: build/dependencies
          key: windows-offline-${{ hashFiles('scripts/prepare-dependencies.ps1') }}
      - name: Build and test
        shell: powershell
        run: ./scripts/build-suite.ps1 -Test
      - name: Verify release tag matches source version
        if: startsWith(github.ref, 'refs/tags/')
        shell: powershell
        run: |
          $source = Get-Content src/Core.cs -Raw
          $version = [regex]::Match($source, 'const string Version = "(\d+\.\d+\.\d+)"').Groups[1].Value
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag does not match Core.Version.' }
      - uses: actions/upload-artifact@v4
        with:
          name: GoogleNas-windows-x64
          path: |
            dist/*
            build/*.zip
  release:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GoogleNas-windows-x64
          path: artifacts
      - name: Publish stable release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(sed -n 's/.*const string Version = "\([0-9.]*\)";.*/\1/p' src/Core.cs)
          TAG="v$VERSION"
          if [[ "$RELEASE_TAG" == v* && "$RELEASE_TAG" != "$TAG" ]]; then exit 1; fi
          gh release create "$TAG" artifacts/dist/CyanNas.exe artifacts/dist/CyanNas.exe.sha256 artifacts/dist/GoogleNas.exe artifacts/dist/GoogleNas.exe.sha256 artifacts/dist/GoogleNasSetup.exe artifacts/dist/GoogleNasSetup.exe.sha256 artifacts/dist/CyanNasSetup.exe artifacts/dist/CyanNasSetup.exe.sha256 artifacts/dist/CyanNasServer.exe artifacts/dist/CyanNasServer.exe.sha256 artifacts/dist/CyanNasClient.exe artifacts/dist/CyanNasClient.exe.sha256 --target "$GITHUB_SHA" --title "CYAN NAS $VERSION" --generate-notes
      - name: Publish product and release links to CYANPRO
        shell: pwsh
        env:
          CYAN_DEV_TOKEN: ${{ secrets.CYAN_DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CYAN_DEV_TOKEN)) {
            Write-Warning 'CYANPRO sync is pending: repository secret CYAN_DEV_TOKEN has not been configured. Register this release using scripts/publish-cyanpro.ps1.'
            'CYANPRO synchronization requires the CYAN_DEV_TOKEN repository secret.' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          } else {
            ./scripts/publish-cyanpro.ps1 -UpdateProduct -Release
          }
